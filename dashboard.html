<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>My Matches — twnhouse.ca</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--navy:#0F1F3D;--navy-mid:#162A4F;--gold:#C9A84C;--gold-light:#E4C97A;--cream:#F8F7F4;--grey:#E8E6E1;--text:#1A1A2E;--white:#fff}body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(15,31,61,0.97);backdrop-filter:blur(12px)}.logo{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;color:#fff;text-decoration:none}.logo span{color:var(--gold)}.nav-right{display:flex;align-items:center;gap:1rem}.nav-user{font-size:0.85rem;color:rgba(255,255,255,0.6)}.nav-user strong{color:#fff}.btn-out{background:none;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);padding:0.4rem 1rem;border-radius:6px;font-size:0.8rem;cursor:pointer;font-family:'Inter',sans-serif}.btn-out:hover{border-color:var(--gold);color:var(--gold)}.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--navy)}.auth-card{background:#fff;border-radius:24px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,0.3)}.auth-logo{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;color:var(--navy)}.auth-logo span{color:var(--gold)}.auth-title{font-family:'Fraunces',serif;font-size:1.75rem;font-weight:700;color:var(--navy);margin:1.25rem 0 0.4rem}.auth-sub{font-size:0.9rem;color:#5A6070;margin-bottom:1.75rem}.auth-field{margin-bottom:1rem}.auth-label{display:block;font-size:0.85rem;font-weight:600;color:var(--text);margin-bottom:0.4rem}.auth-input{width:100%;padding:0.75rem 1rem;border-radius:10px;border:1px solid var(--grey);font-size:0.92rem;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s,box-shadow 0.2s}.auth-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.15)}.auth-error{color:#C0392B;font-size:0.85rem;margin-bottom:0.75rem;display:none}.auth-btn{width:100%;padding:0.9rem;border-radius:10px;border:none;background:var(--navy);color:#fff;font-size:0.95rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}.auth-btn:hover{background:var(--navy-mid)}.auth-btn:disabled{opacity:0.6;cursor:default}.auth-link{text-align:center;margin-top:1.25rem;font-size:0.85rem;color:#5A6070}.auth-link a{color:var(--navy);font-weight:600;text-decoration:none}.dashboard{display:none;padding-top:72px;min-height:100vh}.dash-header{background:var(--navy);padding:2.5rem 2rem}.dash-header-inner{max-width:1100px;margin:0 auto}.dash-greeting{font-family:'Fraunces',serif;font-size:clamp(1.5rem,3vw,2rem);font-weight:700;color:#fff;margin-bottom:0.4rem}.dash-sub{font-size:0.9rem;color:rgba(255,255,255,0.55)}.dash-stats{display:flex;gap:1.5rem;margin-top:1.5rem;flex-wrap:wrap}.dash-stat{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:0.9rem 1.25rem;min-width:120px}.dash-stat-num{font-family:'Fraunces',serif;font-size:1.75rem;font-weight:700;color:var(--gold)}.dash-stat-label{font-size:0.75rem;color:rgba(255,255,255,0.45);margin-top:2px}.dash-body{max-width:1100px;margin:0 auto;padding:2rem}.dash-section-title{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600;color:var(--navy);margin-bottom:1.25rem}.matches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem}.match-card{background:#fff;border-radius:16px;border:1px solid var(--grey);overflow:hidden;transition:transform 0.2s,box-shadow 0.2s}.match-card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(15,31,61,0.1)}.mct{background:var(--navy);padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between}.score-badge{font-size:0.8rem;font-weight:700;padding:0.3rem 0.8rem;border-radius:99px}.sh{background:var(--gold);color:var(--navy)}.sm{background:#E07B39;color:#fff}.sl{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.7)}.mtype{font-size:0.7rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.5)}.mcb{padding:1.25rem 1.5rem}.maddr{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600;color:var(--navy);margin-bottom:0.25rem}.mdet{font-size:0.82rem;color:#5A6070;margin-bottom:1rem}.mtags{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1rem}.mtag{font-size:0.72rem;font-weight:500;padding:0.3rem 0.7rem;border-radius:99px;border:1px solid var(--grey);color:#5A6070}.mtag.g{border-color:var(--gold);color:var(--gold)}.mreasons{margin-bottom:1rem}.mreason{display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;color:#3A4050;padding:0.2rem 0}.mreason::before{content:"✓";color:var(--gold);font-weight:700}.ai-box{background:linear-gradient(135deg,rgba(15,31,61,0.03),rgba(201,168,76,0.05));border:1px solid rgba(201,168,76,0.2);border-radius:10px;padding:0.9rem 1rem;margin-bottom:1rem}.ai-label{font-size:0.65rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:0.4rem}.ai-text{font-size:0.82rem;color:#3A4050;line-height:1.6}.ai-loading{color:#9CA3AF;font-style:italic}.mcf{padding:0 1.5rem 1.25rem;display:flex;gap:0.6rem}.btn-conn{flex:1;padding:0.65rem;border-radius:8px;border:none;background:var(--gold);color:var(--navy);font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}.btn-conn:hover{background:var(--gold-light)}.btn-sk{padding:0.65rem 1rem;border-radius:8px;border:1px solid var(--grey);background:#fff;color:#5A6070;font-size:0.85rem;cursor:pointer;font-family:'Inter',sans-serif}.empty-state{text-align:center;padding:4rem 2rem}.empty-icon{font-size:3rem;margin-bottom:1rem}.empty-title{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--navy);margin-bottom:0.5rem}.empty-sub{font-size:0.9rem;color:#5A6070;max-width:320px;margin:0 auto 1.5rem}.spinner{width:36px;height:36px;border:3px solid var(--grey);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}@keyframes spin{to{transform:rotate(360deg)}}.lscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:1rem}.ltext{font-size:0.9rem;color:#5A6070}@media(max-width:640px){.matches-grid{grid-template-columns:1fr}.dash-body{padding:1.25rem}}</style></head><body><nav id="mainNav" style="display:none"><a href="/" class="logo">twn<span>house</span>.ca</a><div class="nav-right"><span class="nav-user" id="navUser"></span><button class="btn-out" id="signOutBtn">Sign out</button></div></nav><div class="auth-screen" id="authScreen"><div class="auth-card"><div class="auth-logo">twn<span>house</span>.ca</div><h1 class="auth-title">Welcome back</h1><p class="auth-sub">Sign in to see your AI-powered matches</p><div class="auth-field"><label class="auth-label">Email</label><input class="auth-input" type="email" id="loginEmail" placeholder="you@email.com"/></div><div class="auth-field"><label class="auth-label">Password</label><input class="auth-input" type="password" id="loginPassword" placeholder="••••••••"/></div><div class="auth-error" id="loginError"></div><button class="auth-btn" id="loginBtn">Sign in →</button><div class="auth-link">Don't have an account? <a href="/">Create a free profile</a></div></div></div><div class="dashboard" id="dashboard"><div class="dash-header"><div class="dash-header-inner"><div class="dash-greeting" id="dashGreeting">Good morning!</div><div class="dash-sub" id="dashSub">Your AI-powered landlord matches</div><div class="dash-stats"><div class="dash-stat"><div class="dash-stat-num" id="statMatches">-</div><div class="dash-stat-label">Matches found</div></div><div class="dash-stat"><div class="dash-stat-num" id="statTopScore">-</div><div class="dash-stat-label">Top match score</div></div><div class="dash-stat"><div class="dash-stat-num" id="statCity">-</div><div class="dash-stat-label">Your city</div></div></div></div></div><div class="dash-body"><div class="dash-section-title">Your matches</div><div id="matchesContainer"><div class="lscreen"><div class="spinner"></div><div class="ltext">Finding your matches...</div></div></div></div></div><script>(function(){const TK="twnhouse_tenant_token";const DK="twnhouse_tenant_data";const token=localStorage.getItem(TK);const td=localStorage.getItem(DK);if(token&&td)showDash(JSON.parse(td),token);document.getElementById("loginBtn").addEventListener("click",async()=>{const email=document.getElementById("loginEmail").value.trim();const pw=document.getElementById("loginPassword").value;const err=document.getElementById("loginError");const btn=document.getElementById("loginBtn");if(!email||!pw){showErr("Please enter email and password.");return;}btn.disabled=true;btn.textContent="Signing in...";err.style.display="none";try{const res=await fetch("/api/tenant-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});const d=await res.json();if(!res.ok){showErr(d.error||"Login failed");btn.disabled=false;btn.textContent="Sign in →";return;}localStorage.setItem(TK,d.token);localStorage.setItem(DK,JSON.stringify(d.tenant));showDash(d.tenant,d.token);}catch(e){showErr("Something went wrong.");btn.disabled=false;btn.textContent="Sign in →";}});document.getElementById("loginEmail").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginPassword").focus();});document.getElementById("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click();});document.getElementById("signOutBtn").addEventListener("click",()=>{localStorage.removeItem(TK);localStorage.removeItem(DK);location.reload();});function showErr(msg){const el=document.getElementById("loginError");el.textContent=msg;el.style.display="block";}function showDash(tenant,token){document.getElementById("authScreen").style.display="none";document.getElementById("mainNav").style.display="flex";document.getElementById("dashboard").style.display="block";document.getElementById("navUser").innerHTML="Signed in as <strong>"+tenant.first_name+"</strong>";const h=new Date().getHours();const g=h<12?"Good morning":h<17?"Good afternoon":"Good evening";document.getElementById("dashGreeting").textContent=g+", "+tenant.first_name+"! 🏠";document.getElementById("dashSub").textContent="AI-powered matches — "+(tenant.city||"Ontario")+", budget up to $"+(tenant.budget?Number(tenant.budget).toLocaleString():"?")+"/mo";document.getElementById("statCity").textContent=tenant.city||"?";loadMatches(tenant,token);}async function loadMatches(tenant,token){try{const res=await fetch("/api/tenant-matches",{headers:{"Authorization":"Bearer "+token}});const data=await res.json();if(!res.ok){if(res.status===401){localStorage.removeItem(TK);localStorage.removeItem(DK);location.reload();return;}throw new Error(data.error);}const matches=data.matches||[];document.getElementById("statMatches").textContent=matches.length;document.getElementById("statTopScore").textContent=matches.length?matches[0].score+"%":"0%";if(!matches.length){document.getElementById("matchesContainer").innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No matches yet</div><div class="empty-sub">We're building our landlord network. Check back soon.</div><a href="/" style="display:inline-block;background:var(--navy);color:#fff;padding:0.75rem 1.75rem;border-radius:8px;font-weight:600;text-decoration:none;font-size:0.9rem">Back to homepage</a></div>';return;}renderMatches(matches);matches.slice(0,5).forEach((m,i)=>loadAI(tenant,m,i));}catch(e){document.getElementById("matchesContainer").innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load matches</div><div class="empty-sub">'+e.message+'</div></div>';}}function renderMatches(matches){const grid=document.createElement("div");grid.className="matches-grid";matches.forEach((m,i)=>{const sc=m.score>=70?"sh":m.score>=40?"sm":"sl";const card=document.createElement("div");card.className="match-card";const av=m.available_date?new Date(m.available_date).toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}):"Flexible";const rh=(m.reasons||[]).map(r=>'<div class="mreason">'+r+"</div>").join("");card.innerHTML='<div class="mct"><span class="mtype">Landlord</span><span class="score-badge '+sc+'">'+m.score+'% match</span></div><div class="mcb"><div class="maddr">'+( m.address||"Location on request")+'</div><div class="mdet">'+( m.property_type||"")+" · "+(m.bedrooms||"")+" · Available "+av+'</div><div class="mtags"><span class="mtag g">$'+Number(m.rent).toLocaleString()+'/mo</span>'+(m.pets_allowed?'<span class="mtag">'+m.pets_allowed+"</span>":"")+(m.included_utilities&&m.included_utilities!=="None"?'<span class="mtag">'+m.included_utilities+" incl.</span>":"")+(m.lease_length?'<span class="mtag">'+m.lease_length+"</span>":"")+'</div><div class="mreasons">'+rh+'</div><div class="ai-box" id="ai_'+i+'"><div class="ai-label">✨ AI insight</div><div class="ai-text ai-loading" id="ai_text_'+i+'">Analyzing compatibility...</div></div></div><div class="mcf"><button class="btn-conn">✉️ Express interest</button><button class="btn-sk">Skip</button></div>';grid.appendChild(card);});document.getElementById("matchesContainer").innerHTML="";document.getElementById("matchesContainer").appendChild(grid);}async function loadAI(tenant,match,index){const el=document.getElementById("ai_text_"+index);if(!el)return;try{const prompt="You are a rental matching assistant for twnhouse.ca. In 2 sentences max, explain warmly and specifically why this landlord listing is a good match for this tenant.\n\nTenant: "+tenant.first_name+", budget $"+tenant.budget+"/mo, looking in "+tenant.city+", wants "+(tenant.property_type||"any property")+", "+(tenant.bedrooms||"any bedrooms")+", "+(tenant.pets||"no pets")+", "+(tenant.lease_length||"flexible")+" lease.\n\nListing: "+match.address+", "+match.property_type+", "+match.bedrooms+", $"+match.rent+"/mo, "+match.lease_length+" lease, pets: "+match.pets_allowed+".\n\nMatch score: "+match.score+"%. Reasons: "+(match.reasons||[]).join(", ")+".";const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:150,messages:[{role:"user",content:prompt}]})});const d=await res.json();const text=d.content?.[0]?.text||"This listing aligns well with your criteria.";el.textContent=text;el.classList.remove("ai-loading");}catch(e){el.textContent="This listing aligns well with your search criteria.";el.classList.remove("ai-loading");}}})();</script></body></html>

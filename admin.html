<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Admin — twnhouse.ca</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0F1F3D;--navy-mid:#162A4F;--gold:#C9A84C;--gold-light:#E4C97A;--cream:#F8F7F4;--grey:#E8E6E1;--text:#1A1A2E;--red:#C0392B;--green:#27AE60}
body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
/* GATE */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy)}
.gate-card{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,0.3);text-align:center}
.gate-logo{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:700;color:var(--navy)}
.gate-logo span{color:var(--gold)}
.gate-title{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:700;color:var(--navy);margin:1rem 0 0.4rem}
.gate-sub{font-size:0.85rem;color:#5A6070;margin-bottom:1.5rem}
.gate-input{width:100%;padding:0.75rem 1rem;border-radius:10px;border:1px solid var(--grey);font-size:0.92rem;font-family:'Inter',sans-serif;outline:none;margin-bottom:1rem;transition:border-color 0.2s}
.gate-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.15)}
.gate-btn{width:100%;padding:0.85rem;border-radius:10px;border:none;background:var(--navy);color:#fff;font-size:0.92rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.gate-err{color:var(--red);font-size:0.85rem;margin-top:0.75rem;display:none}
/* LAYOUT */
.app{display:none}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--navy);padding:1.5rem 1rem;display:flex;flex-direction:column;gap:0.25rem;z-index:10}
.sidebar-logo{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:1.5rem;padding:0 0.5rem}
.sidebar-logo span{color:var(--gold)}
.sidebar-badge{font-size:0.65rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;background:rgba(201,168,76,0.2);color:var(--gold);padding:0.15rem 0.5rem;border-radius:4px;margin-left:0.5rem}
.nav-item{display:flex;align-items:center;gap:0.6rem;padding:0.6rem 0.75rem;border-radius:8px;border:none;background:none;color:rgba(255,255,255,0.6);font-size:0.875rem;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;text-align:left;width:100%;transition:all 0.15s}
.nav-item:hover{background:rgba(255,255,255,0.07);color:#fff}
.nav-item.active{background:rgba(201,168,76,0.15);color:var(--gold)}
.nav-icon{font-size:1rem;width:20px;text-align:center}
.sidebar-bottom{margin-top:auto}
.main{margin-left:220px;padding:2rem;min-height:100vh}
/* HEADER */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;flex-wrap:wrap;gap:1rem}
.page-title{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;color:var(--navy)}
.page-actions{display:flex;gap:0.75rem;align-items:center}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:#fff;border-radius:12px;padding:1.25rem;border:1px solid var(--grey)}
.stat-num{font-family:'Fraunces',serif;font-size:2rem;font-weight:700;color:var(--gold)}
.stat-label{font-size:0.78rem;color:#5A6070;margin-top:2px}
/* SEARCH/FILTER */
.toolbar{display:flex;gap:0.75rem;margin-bottom:1rem;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:0.6rem 1rem;border-radius:8px;border:1px solid var(--grey);font-size:0.875rem;font-family:'Inter',sans-serif;outline:none}
.search-input:focus{border-color:var(--gold)}
.filter-select{padding:0.6rem 1rem;border-radius:8px;border:1px solid var(--grey);font-size:0.875rem;font-family:'Inter',sans-serif;outline:none;background:#fff}
/* TABLE */
.table-card{background:#fff;border-radius:12px;border:1px solid var(--grey);overflow:auto}
.table{width:100%;border-collapse:collapse;font-size:0.82rem;min-width:800px}
.table th{background:var(--navy);color:#fff;padding:0.75rem 1rem;text-align:left;font-weight:600;font-size:0.72rem;letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap}
.table td{padding:0.7rem 1rem;border-bottom:1px solid var(--grey);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:rgba(201,168,76,0.03)}
/* BADGES */
.badge{display:inline-block;font-size:0.68rem;font-weight:600;padding:0.2rem 0.6rem;border-radius:99px;border:1px solid}
.badge-pro{background:rgba(201,168,76,0.12);color:#7a5c10;border-color:rgba(201,168,76,0.4)}
.badge-basic{background:rgba(0,0,0,0.04);color:#5A6070;border-color:var(--grey)}
.badge-yes{background:rgba(39,174,96,0.1);color:#1a7a3f;border-color:rgba(39,174,96,0.3)}
.badge-no{background:rgba(192,57,43,0.08);color:#7a1a10;border-color:rgba(192,57,43,0.2)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:0.35rem;padding:0.4rem 0.8rem;border-radius:6px;border:none;font-size:0.78rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;text-decoration:none}
.btn-sm{padding:0.3rem 0.6rem;font-size:0.72rem}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-mid)}
.btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{background:var(--gold-light)}
.btn-danger{background:rgba(192,57,43,0.1);color:var(--red);border:1px solid rgba(192,57,43,0.2)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-ghost{background:none;border:1px solid var(--grey);color:#5A6070}.btn-ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn-actions{display:flex;gap:0.4rem}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,31,61,0.6);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:2rem;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,0.25);margin:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 1.75rem;border-bottom:1px solid var(--grey)}
.modal-title{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:700;color:var(--navy)}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--grey);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--gold);color:#fff}
.modal-body{padding:1.75rem}
.modal-footer{padding:1rem 1.75rem;border-top:1px solid var(--grey);display:flex;gap:0.75rem;justify-content:flex-end}
/* DETAIL GRID */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.detail-field{display:flex;flex-direction:column;gap:0.25rem}
.detail-field.full{grid-column:1/-1}
.detail-label{font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9CA3AF}
.detail-value{font-size:0.9rem;color:var(--text);font-weight:500}
.detail-section{font-family:'Fraunces',serif;font-size:1rem;font-weight:600;color:var(--navy);margin:1.25rem 0 0.75rem;padding-bottom:0.4rem;border-bottom:1px solid var(--grey);grid-column:1/-1}
/* EDIT FORM */
.form-field{margin-bottom:1rem}
.form-label{display:block;font-size:0.82rem;font-weight:600;color:var(--text);margin-bottom:0.35rem}
.form-input,.form-select{width:100%;padding:0.65rem 0.9rem;border-radius:8px;border:1px solid var(--grey);font-size:0.875rem;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s}
.form-input:focus,.form-select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.12)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
/* EMPTY/LOADING */
.empty{text-align:center;padding:3rem;color:#9CA3AF;font-size:0.9rem}
.loading{text-align:center;padding:3rem;color:#9CA3AF}
.spinner{width:28px;height:28px;border:2.5px solid var(--grey);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 0.75rem}
@keyframes spin{to{transform:rotate(360deg)}}
/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--navy);color:#fff;padding:0.75rem 1.25rem;border-radius:10px;font-size:0.875rem;font-weight:500;z-index:9999;transform:translateY(100px);opacity:0;transition:all 0.3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(15,31,61,0.5);z-index:2000;display:none;align-items:center;justify-content:center}
.confirm-overlay.open{display:flex}
.confirm-box{background:#fff;border-radius:16px;padding:2rem;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.confirm-icon{font-size:2.5rem;margin-bottom:0.75rem}
.confirm-title{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:0.4rem}
.confirm-sub{font-size:0.85rem;color:#5A6070;margin-bottom:1.5rem}
.confirm-actions{display:flex;gap:0.75rem;justify-content:center}
@media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.form-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}}
</style></head><body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-logo">twn<span>house</span>.ca</div>
    <div class="gate-title">Admin Panel</div>
    <div class="gate-sub">Enter passphrase to continue</div>
    <input class="gate-input" type="password" id="passInput" placeholder="Passphrase"/>
    <button class="gate-btn" id="passBtn">Enter →</button>
    <div class="gate-err" id="gateErr">Incorrect passphrase</div>
  </div>
</div>

<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-logo">twn<span>house</span>.ca <span class="sidebar-badge">Admin</span></div>
    <button class="nav-item active" onclick="showPage('tenants')" id="navTenants"><span class="nav-icon">🔑</span> Tenants</button>
    <button class="nav-item" onclick="showPage('landlords')" id="navLandlords"><span class="nav-icon">🏠</span> Landlords</button>
    <div class="sidebar-bottom">
      <button class="nav-item" onclick="lock()"><span class="nav-icon">🔒</span> Lock</button>
    </div>
  </div>

  <div class="main">
    <!-- TENANTS PAGE -->
    <div id="pageT">
      <div class="page-header">
        <div class="page-title">Tenants</div>
      </div>
      <div class="stats-row" id="statsT"></div>
      <div class="toolbar">
        <input class="search-input" id="searchT" placeholder="Search name, email, city…" oninput="filterTable('T')"/>
        <select class="filter-select" id="filterCityT" onchange="filterTable('T')"><option value="">All cities</option></select>
        <select class="filter-select" id="filterPetsT" onchange="filterTable('T')"><option value="">All pets</option></select>
      </div>
      <div class="table-card"><div id="tableT" class="loading"><div class="spinner"></div>Loading tenants…</div></div>
    </div>

    <!-- LANDLORDS PAGE -->
    <div id="pageL" style="display:none">
      <div class="page-header">
        <div class="page-title">Landlords</div>
      </div>
      <div class="stats-row" id="statsL"></div>
      <div class="toolbar">
        <input class="search-input" id="searchL" placeholder="Search name, email, address…" oninput="filterTable('L')"/>
        <select class="filter-select" id="filterPlanL" onchange="filterTable('L')"><option value="">All plans</option><option value="pro">Pro</option><option value="basic">Basic</option></select>
        <select class="filter-select" id="filterCityL" onchange="filterTable('L')"><option value="">All cities</option></select>
      </div>
      <div class="table-card"><div id="tableL" class="loading"><div class="spinner"></div>Loading landlords…</div></div>
    </div>
  </div>
</div>

<!-- VIEW MODAL -->
<div class="modal-overlay" id="viewModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="viewTitle">Details</div>
      <button class="modal-close" onclick="closeModal('viewModal')">✕</button>
    </div>
    <div class="modal-body" id="viewBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('viewModal')">Close</button>
      <button class="btn btn-gold" id="viewEditBtn">✏️ Edit</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="editTitle">Edit</div>
      <button class="modal-close" onclick="closeModal('editModal')">✕</button>
    </div>
    <div class="modal-body" id="editBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn btn-gold" id="editSaveBtn">💾 Save changes</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="confirm-overlay" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-title" id="confirmTitle">Delete record?</div>
    <div class="confirm-sub" id="confirmSub">This action cannot be undone.</div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="closeModal('confirmModal')">Cancel</button>
      <button class="btn btn-danger" id="confirmOkBtn">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
const PASS='twnhouse2024!';
let tenantsData=[], landlordsData=[];
let currentEditType=null, currentEditId=null, currentViewType=null;

// AUTH
document.getElementById('passBtn').addEventListener('click',tryPass);
document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryPass();});
function tryPass(){
  if(document.getElementById('passInput').value===PASS){
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    loadAll();
  }else{
    document.getElementById('gateErr').style.display='block';
  }
}
window.lock=function(){document.getElementById('gate').style.display='flex';document.getElementById('app').style.display='none';document.getElementById('passInput').value='';};

// NAV
window.showPage=function(p){
  document.getElementById('pageT').style.display=p==='tenants'?'block':'none';
  document.getElementById('pageL').style.display=p==='landlords'?'block':'none';
  document.getElementById('navTenants').classList.toggle('active',p==='tenants');
  document.getElementById('navLandlords').classList.toggle('active',p==='landlords');
};

// LOAD
async function loadAll(){
  await Promise.all([loadTenants(), loadLandlords()]);
}

async function loadTenants(){
  try{
    const r=await fetch('/api/admin?table=tenants');
    const d=await r.json();
    tenantsData=d.rows||[];
    renderTenantStats();
    populateTenantFilters();
    renderTenantTable(tenantsData);
  }catch(e){document.getElementById('tableT').innerHTML='<div class="empty">Failed to load tenants</div>';}
}

async function loadLandlords(){
  try{
    const r=await fetch('/api/admin?table=landlords');
    const d=await r.json();
    landlordsData=d.rows||[];
    renderLandlordStats();
    populateLandlordFilters();
    renderLandlordTable(landlordsData);
  }catch(e){document.getElementById('tableL').innerHTML='<div class="empty">Failed to load landlords</div>';}
}

// STATS
function renderTenantStats(){
  const t=tenantsData;
  document.getElementById('statsT').innerHTML=`
    <div class="stat-card"><div class="stat-num">${t.length}</div><div class="stat-label">Total tenants</div></div>
    <div class="stat-card"><div class="stat-num">${t.filter(x=>x.photo_id_uploaded).length}</div><div class="stat-label">ID verified</div></div>
    <div class="stat-card"><div class="stat-num">${[...new Set(t.map(x=>x.city).filter(Boolean))].length}</div><div class="stat-label">Cities</div></div>
    <div class="stat-card"><div class="stat-num">${t.filter(x=>x.budget).length}</div><div class="stat-label">With budget</div></div>`;
}

function renderLandlordStats(){
  const l=landlordsData;
  document.getElementById('statsL').innerHTML=`
    <div class="stat-card"><div class="stat-num">${l.length}</div><div class="stat-label">Total landlords</div></div>
    <div class="stat-card"><div class="stat-num">${l.filter(x=>x.plan==='pro').length}</div><div class="stat-label">Pro plan</div></div>
    <div class="stat-card"><div class="stat-num">${l.filter(x=>x.photo_id_uploaded).length}</div><div class="stat-label">ID verified</div></div>
    <div class="stat-card"><div class="stat-num">${l.filter(x=>x.rent).length?'$'+Math.round(l.filter(x=>x.rent).reduce((a,b)=>a+Number(b.rent),0)/l.filter(x=>x.rent).length).toLocaleString():'-'}</div><div class="stat-label">Avg rent/mo</div></div>`;
}

// FILTERS
function populateTenantFilters(){
  const cities=[...new Set(tenantsData.map(x=>x.city).filter(Boolean))].sort();
  const pets=[...new Set(tenantsData.map(x=>x.pets).filter(Boolean))].sort();
  const cs=document.getElementById('filterCityT');
  const ps=document.getElementById('filterPetsT');
  cities.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o);});
  pets.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;ps.appendChild(o);});
}
function populateLandlordFilters(){
  const cities=[...new Set(landlordsData.map(x=>x.address?.split(',').slice(-2,-1)[0]?.trim()).filter(Boolean))].sort();
  const cs=document.getElementById('filterCityL');
  cities.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o);});
}

window.filterTable=function(type){
  if(type==='T'){
    const q=document.getElementById('searchT').value.toLowerCase();
    const city=document.getElementById('filterCityT').value;
    const pets=document.getElementById('filterPetsT').value;
    const filtered=tenantsData.filter(r=>{
      const match=!q||(r.first_name+' '+r.last_name+' '+r.email+' '+r.city).toLowerCase().includes(q);
      const cMatch=!city||r.city===city;
      const pMatch=!pets||r.pets===pets;
      return match&&cMatch&&pMatch;
    });
    renderTenantTable(filtered);
  }else{
    const q=document.getElementById('searchL').value.toLowerCase();
    const plan=document.getElementById('filterPlanL').value;
    const city=document.getElementById('filterCityL').value;
    const filtered=landlordsData.filter(r=>{
      const match=!q||(r.first_name+' '+r.last_name+' '+r.email+' '+(r.address||'')).toLowerCase().includes(q);
      const pMatch=!plan||r.plan===plan;
      const cMatch=!city||((r.address||'').includes(city));
      return match&&pMatch&&cMatch;
    });
    renderLandlordTable(filtered);
  }
};

// TENANT TABLE
function renderTenantTable(rows){
  if(!rows.length){document.getElementById('tableT').innerHTML='<div class="empty">No tenants found</div>';return;}
  document.getElementById('tableT').innerHTML=`<table class="table">
    <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>City</th><th>Budget</th><th>Property</th><th>Beds</th><th>Pets</th><th>Lease</th><th>Employment</th><th>Move-in</th><th>ID</th><th>Joined</th><th>Actions</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><strong>${r.id}</strong></td>
      <td><strong>${r.first_name} ${r.last_name}</strong></td>
      <td style="color:#5A6070">${r.email}</td>
      <td>${r.phone||'—'}</td>
      <td>${r.city||'—'}</td>
      <td>${r.budget?'<strong>$'+Number(r.budget).toLocaleString()+'/mo</strong>':'—'}</td>
      <td>${r.property_type||'—'}</td>
      <td>${r.bedrooms||'—'}</td>
      <td>${r.pets||'—'}</td>
      <td>${r.lease_length||'—'}</td>
      <td>${r.employment_status||'—'}</td>
      <td>${r.move_in_date?new Date(r.move_in_date).toLocaleDateString('en-CA'):'—'}</td>
      <td>${r.photo_id_uploaded?'<span class="badge badge-yes">✓ Yes</span>':'<span class="badge badge-no">No</span>'}</td>
      <td style="color:#9CA3AF;font-size:0.75rem">${r.created_at?new Date(r.created_at).toLocaleDateString('en-CA'):'—'}</td>
      <td><div class="btn-actions">
        <button class="btn btn-ghost btn-sm" onclick="viewRecord('tenant',${r.id})">👁️ View</button>
        <button class="btn btn-primary btn-sm" onclick="editRecord('tenant',${r.id})">✏️ Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteRecord('tenant',${r.id},'${r.first_name} ${r.last_name}')">🗑️</button>
      </div></td>
    </tr>`).join('')}</tbody></table>`;
}

// LANDLORD TABLE
function renderLandlordTable(rows){
  if(!rows.length){document.getElementById('tableL').innerHTML='<div class="empty">No landlords found</div>';return;}
  document.getElementById('tableL').innerHTML=`<table class="table">
    <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Type</th><th>Rent</th><th>Beds</th><th>Bath</th><th>Lease</th><th>Pets</th><th>Available</th><th>Plan</th><th>ID</th><th>Joined</th><th>Actions</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><strong>${r.id}</strong></td>

async function saveEdit(type,id){
  const fields=type==='tenant'
    ?['first_name','last_name','email','phone','city','budget','property_type','bedrooms','pets','occupants','employment_status','lifestyle','lease_length','move_in_date','photo_id_uploaded','notes']
    :['first_name','last_name','email','phone','address','property_type','bedrooms','bathrooms','rent','available_date','lease_length','included_utilities','tenant_type','pets_allowed','smoking','plan','photo_id_uploaded','notes'];

  const payload={id,type};
  fields.forEach(f=>{
    const el=document.getElementById('ef_'+f);
    if(!el)return;
    let v=el.value;
    if(f==='photo_id_uploaded')v=v==='true';
    else if(f==='budget'||f==='rent')v=v?parseInt(v):null;
    payload[f]=v;
  });

  const btn=document.getElementById('editSaveBtn');
  btn.disabled=true;btn.textContent='Saving…';
  try{
    const res=await fetch('/api/admin-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await res.json();
    if(!res.ok)throw new Error(d.error||'Save failed');
    // Update local data
    if(type==='tenant'){const i=tenantsData.findIndex(x=>x.id===id);if(i>=0)Object.assign(tenantsData[i],payload);}
    else{const i=landlordsData.findIndex(x=>x.id===id);if(i>=0)Object.assign(landlordsData[i],payload);}
    closeModal('editModal');
    type==='tenant'?renderTenantTable(tenantsData):renderLandlordTable(landlordsData);
    renderTenantStats();renderLandlordStats();
    showToast('Record updated successfully','success');
  }catch(e){showToast(e.message,'error');}
  finally{btn.disabled=false;btn.textContent='💾 Save changes';}
}

// DELETE
window.deleteRecord=function(type,id,name){
  document.getElementById('confirmTitle').textContent='Delete '+name+'?';
  document.getElementById('confirmSub').textContent='This will permanently remove this '+(type==='tenant'?'tenant':'landlord')+' from the database. This cannot be undone.';
  document.getElementById('confirmOkBtn').onclick=async()=>{
    try{
      const res=await fetch('/api/admin-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,type})});
      const d=await res.json();
      if(!res.ok)throw new Error(d.error||'Delete failed');
      if(type==='tenant'){tenantsData=tenantsData.filter(x=>x.id!==id);renderTenantTable(tenantsData);renderTenantStats();}
      else{landlordsData=landlordsData.filter(x=>x.id!==id);renderLandlordTable(landlordsData);renderLandlordStats();}
      closeModal('confirmModal');
      showToast(name+' deleted','success');
    }catch(e){showToast(e.message,'error');closeModal('confirmModal');}
  };
  openModal('confirmModal');
};

// UPGRADE
window.upgradePro=function(id){
  const r=landlordsData.find(x=>x.id===id);
  if(!r)return;
  document.getElementById('confirmTitle').textContent='Upgrade to Pro?';
  document.getElementById('confirmSub').textContent='Upgrade '+r.first_name+' '+r.last_name+' to Pro plan — they will get full access to all matches.';
  document.getElementById('confirmOkBtn').textContent='Upgrade ✨';
  document.getElementById('confirmOkBtn').className='btn btn-gold';
  document.getElementById('confirmOkBtn').onclick=async()=>{
    try{
      const res=await fetch('/api/admin-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,type:'landlord',plan:'pro'})});
      const d=await res.json();
      if(!res.ok)throw new Error(d.error||'Failed');
      const i=landlordsData.findIndex(x=>x.id===id);
      if(i>=0)landlordsData[i].plan='pro';
      renderLandlordTable(landlordsData);renderLandlordStats();
      closeModal('confirmModal');
      showToast(r.first_name+' upgraded to Pro ✨','success');
    }catch(e){showToast(e.message,'error');closeModal('confirmModal');}
    document.getElementById('confirmOkBtn').textContent='Delete';
    document.getElementById('confirmOkBtn').className='btn btn-danger';
  };
  openModal('confirmModal');
};

// UTILS
function esc(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function openModal(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden';}
window.closeModal=function(id){document.getElementById(id).classList.remove('open');document.body.style.overflow='';}
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+(type||'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
// Close modals on overlay click
['viewModal','editModal','confirmModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{if(e.target===document.getElementById(id))closeModal(id);});
});
})();

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Landlord Dashboard — twnhouse.ca</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--navy:#0F1F3D;--navy-mid:#162A4F;--gold:#C9A84C;--gold-light:#E4C97A;--cream:#F8F7F4;--grey:#E8E6E1;--text:#1A1A2E;--white:#fff}body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(22,42,79,0.97);backdrop-filter:blur(12px)}.logo{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;color:#fff;text-decoration:none}.logo span{color:var(--gold)}.nav-right{display:flex;align-items:center;gap:1rem}.nav-user{font-size:0.85rem;color:rgba(255,255,255,0.6)}.nav-user strong{color:#fff}.btn-out{background:none;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);padding:0.4rem 1rem;border-radius:6px;font-size:0.8rem;cursor:pointer;font-family:'Inter',sans-serif}.btn-out:hover{border-color:var(--gold);color:var(--gold)}.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--navy-mid)}.auth-card{background:#fff;border-radius:24px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,0.3)}.auth-logo{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;color:var(--navy)}.auth-logo span{color:var(--gold)}.auth-badge{display:inline-block;font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;background:rgba(201,168,76,0.12);color:var(--gold);border:1px solid rgba(201,168,76,0.3);padding:0.25rem 0.75rem;border-radius:99px;margin-top:0.5rem}.auth-title{font-family:'Fraunces',serif;font-size:1.75rem;font-weight:700;color:var(--navy);margin:1.25rem 0 0.4rem}.auth-sub{font-size:0.9rem;color:#5A6070;margin-bottom:1.75rem}.auth-field{margin-bottom:1rem}.auth-label{display:block;font-size:0.85rem;font-weight:600;color:var(--text);margin-bottom:0.4rem}.auth-input{width:100%;padding:0.75rem 1rem;border-radius:10px;border:1px solid var(--grey);font-size:0.92rem;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s,box-shadow 0.2s}.auth-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.15)}.auth-error{color:#C0392B;font-size:0.85rem;margin-bottom:0.75rem;display:none}.auth-btn{width:100%;padding:0.9rem;border-radius:10px;border:none;background:var(--navy-mid);color:#fff;font-size:0.95rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}.auth-btn:hover{background:var(--navy)}.auth-btn:disabled{opacity:0.6;cursor:default}.auth-link{text-align:center;margin-top:1.25rem;font-size:0.85rem;color:#5A6070}.auth-link a{color:var(--navy-mid);font-weight:600;text-decoration:none}.dashboard{display:none;padding-top:72px;min-height:100vh}.dash-header{background:var(--navy-mid);padding:2.5rem 2rem}.dash-header-inner{max-width:1100px;margin:0 auto}.dash-greeting{font-family:'Fraunces',serif;font-size:clamp(1.5rem,3vw,2rem);font-weight:700;color:#fff;margin-bottom:0.4rem}.dash-sub{font-size:0.9rem;color:rgba(255,255,255,0.55)}.dash-prop{display:inline-flex;align-items:center;gap:0.6rem;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:0.6rem 1rem;margin-top:1rem;font-size:0.85rem;color:rgba(255,255,255,0.75)}.dash-prop strong{color:#fff}.dash-stats{display:flex;gap:1.25rem;margin-top:1.5rem;flex-wrap:wrap}.dash-stat{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:0.9rem 1.25rem;min-width:110px}.dash-stat-num{font-family:'Fraunces',serif;font-size:1.75rem;font-weight:700;color:var(--gold)}.dash-stat-label{font-size:0.72rem;color:rgba(255,255,255,0.45);margin-top:2px}.dash-body{max-width:1100px;margin:0 auto;padding:2rem}.dash-section-title{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600;color:var(--navy);margin-bottom:1.25rem}.matches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem}.match-card{background:#fff;border-radius:16px;border:1px solid var(--grey);overflow:hidden;transition:transform 0.2s,box-shadow 0.2s}.match-card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(15,31,61,0.1)}.mct{background:var(--navy-mid);padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between}.score-badge{font-size:0.8rem;font-weight:700;padding:0.3rem 0.8rem;border-radius:99px}.sh{background:var(--gold);color:var(--navy)}.sm{background:#E07B39;color:#fff}.sl{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.7)}.mtype{font-size:0.7rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.5)}.mcb{padding:1.25rem 1.5rem}.mname{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;color:var(--navy);margin-bottom:0.2rem;display:flex;align-items:center;gap:0.5rem}.id-badge{font-size:0.65rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;background:rgba(201,168,76,0.1);color:var(--gold);border:1px solid rgba(201,168,76,0.3);padding:0.15rem 0.5rem;border-radius:99px}.mdet{font-size:0.82rem;color:#5A6070;margin-bottom:1rem}.mtags{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1rem}.mtag{font-size:0.72rem;font-weight:500;padding:0.3rem 0.7rem;border-radius:99px;border:1px solid var(--grey);color:#5A6070}.mtag.g{border-color:var(--gold);color:var(--gold)}.mreasons{margin-bottom:1rem}.mreason{display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;color:#3A4050;padding:0.2rem 0}.mreason::before{content:'✓';color:var(--gold);font-weight:700}.ai-box{background:linear-gradient(135deg,rgba(22,42,79,0.04),rgba(201,168,76,0.06));border:1px solid rgba(201,168,76,0.2);border-radius:10px;padding:0.9rem 1rem;margin-bottom:1rem}.ai-label{font-size:0.65rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:0.4rem}.ai-text{font-size:0.82rem;color:#3A4050;line-height:1.6}.ai-loading{color:#9CA3AF;font-style:italic}.contact-reveal{display:none;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);border-radius:8px;padding:0.75rem 1rem;margin:0 1.5rem 1rem;font-size:0.83rem}.contact-reveal.open{display:block}.crow{display:flex;justify-content:space-between;padding:0.25rem 0;font-size:0.83rem}.crow span:first-child{color:#9CA3AF}.crow span:last-child{font-weight:600;color:var(--navy)}.mcf{padding:0 1.5rem 1.25rem;display:flex;gap:0.6rem}.btn-conn{flex:1;padding:0.65rem;border-radius:8px;border:none;background:var(--gold);color:var(--navy);font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}.btn-conn:hover{background:var(--gold-light)}.btn-sk{padding:0.65rem 1rem;border-radius:8px;border:1px solid var(--grey);background:#fff;color:#5A6070;font-size:0.85rem;cursor:pointer;font-family:'Inter',sans-serif}.empty-state{text-align:center;padding:4rem 2rem}.empty-icon{font-size:3rem;margin-bottom:1rem}.empty-title{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--navy);margin-bottom:0.5rem}.empty-sub{font-size:0.9rem;color:#5A6070;max-width:320px;margin:0 auto 1.5rem}.spinner{width:36px;height:36px;border:3px solid var(--grey);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}@keyframes spin{to{transform:rotate(360deg)}}.lscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:1rem}.ltext{font-size:0.9rem;color:#5A6070}@media(max-width:640px){.matches-grid{grid-template-columns:1fr}.dash-body{padding:1.25rem}}</style></head><body><nav id="mainNav" style="display:none"><a href="/" class="logo">twn<span>house</span>.ca</a><div class="nav-right"><span class="nav-user" id="navUser"></span><button class="btn-out" id="signOutBtn">Sign out</button></div></nav><div class="auth-screen" id="authScreen"><div class="auth-card"><div class="auth-logo">twn<span>house</span>.ca</div><div class="auth-badge">🏠 Landlord Portal</div><h1 class="auth-title">Welcome back</h1><p class="auth-sub">Sign in to see tenants matched to your property</p><div class="auth-field"><label class="auth-label">Email</label><input class="auth-input" type="email" id="loginEmail" placeholder="you@email.com"/></div><div class="auth-field"><label class="auth-label">Password</label><input class="auth-input" type="password" id="loginPassword" placeholder="••••••••"/></div><div class="auth-error" id="loginError"></div><button class="auth-btn" id="loginBtn">Sign in →</button><div class="auth-link">Don't have an account? <a href="/">List your property</a></div></div></div><div class="dashboard" id="dashboard"><div class="dash-header"><div class="dash-header-inner"><div class="dash-greeting" id="dashGreeting">Good morning!</div><div class="dash-sub">AI-powered tenant matches for your listing</div><div class="dash-prop" id="dashProp"></div><div class="dash-stats"><div class="dash-stat"><div class="dash-stat-num" id="statMatches">-</div><div class="dash-stat-label">Tenant matches</div></div><div class="dash-stat"><div class="dash-stat-num" id="statTopScore">-</div><div class="dash-stat-label">Top match score</div></div><div class="dash-stat"><div class="dash-stat-num" id="statVerified">-</div><div class="dash-stat-label">ID verified</div></div></div></div></div><div class="dash-body"><div class="dash-section-title">Matched tenants</div><div id="matchesContainer"><div class="lscreen"><div class="spinner"></div><div class="ltext">Finding tenant matches...</div></div></div></div></div><script>(function(){const TK='twnhouse_landlord_token';const DK='twnhouse_landlord_data';const token=localStorage.getItem(TK);const ld=localStorage.getItem(DK);if(token&&ld)showDash(JSON.parse(ld),token);document.getElementById('loginBtn').addEventListener('click',async()=>{const email=document.getElementById('loginEmail').value.trim();const pw=document.getElementById('loginPassword').value;const err=document.getElementById('loginError');const btn=document.getElementById('loginBtn');if(!email||!pw){showErr('Please enter email and password.');return;}btn.disabled=true;btn.textContent='Signing in...';err.style.display='none';try{const res=await fetch('/api/landlord-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});const d=await res.json();if(!res.ok){showErr(d.error||'Login failed');btn.disabled=false;btn.textContent='Sign in →';return;}localStorage.setItem(TK,d.token);localStorage.setItem(DK,JSON.stringify(d.landlord));showDash(d.landlord,d.token);}catch(e){showErr('Something went wrong.');btn.disabled=false;btn.textContent='Sign in →';}});document.getElementById('loginEmail').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginPassword').focus();});document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click();});document.getElementById('signOutBtn').addEventListener('click',()=>{localStorage.removeItem(TK);localStorage.removeItem(DK);location.reload();});function showErr(msg){const el=document.getElementById('loginError');el.textContent=msg;el.style.display='block';}function showDash(landlord,token){document.getElementById('authScreen').style.display='none';document.getElementById('mainNav').style.display='flex';document.getElementById('dashboard').style.display='block';document.getElementById('navUser').innerHTML='Signed in as <strong>'+landlord.first_name+'</strong>';const h=new Date().getHours();const g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';document.getElementById('dashGreeting').textContent=g+', '+landlord.first_name+'! 🏠';document.getElementById('dashProp').innerHTML='<strong>'+(landlord.property_type||'Property')+'</strong> · '+(landlord.address||'Your listing')+' · <strong style="color:var(--gold)">$'+Number(landlord.rent||0).toLocaleString()+'/mo</strong>';loadMatches(landlord,token);}async function loadMatches(landlord,token){try{const res=await fetch('/api/landlord-matches',{headers:{'Authorization':'Bearer '+token}});const data=await res.json();if(!res.ok){if(res.status===401){localStorage.removeItem(TK);localStorage.removeItem(DK);location.reload();return;}throw new Error(data.error);}const matches=data.matches||[];document.getElementById('statMatches').textContent=matches.length;document.getElementById('statTopScore').textContent=matches.length?matches[0].score+'%':'0%';document.getElementById('statVerified').textContent=matches.filter(m=>m.photo_id_uploaded).length;if(!matches.length){document.getElementById('matchesContainer').innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No tenant matches yet</div><div class="empty-sub">We\'re growing our tenant network. Matches appear as tenants sign up in your area.</div><a href="/" style="display:inline-block;background:var(--navy-mid);color:#fff;padding:0.75rem 1.75rem;border-radius:8px;font-weight:600;text-decoration:none;font-size:0.9rem">Back to homepage</a></div>';return;}renderMatches(matches);matches.slice(0,5).forEach((m,i)=>loadAI(landlord,m,i));}catch(e){document.getElementById('matchesContainer').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load matches</div><div class="empty-sub">'+e.message+'</div></div>';}}function renderMatches(matches){const grid=document.createElement('div');grid.className='matches-grid';matches.forEach((m,i)=>{const sc=m.score>=70?'sh':m.score>=40?'sm':'sl';const card=document.createElement('div');card.className='match-card';const mi=m.move_in_date?new Date(m.move_in_date).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}):'Flexible';const rh=(m.reasons||[]).map(r=>'<div class="mreason">'+r+'</div>').join('');const idb=m.photo_id_uploaded?'<span class="id-badge">🪪 ID Verified</span>':'';card.innerHTML='<div class="mct"><span class="mtype">Tenant</span><span class="score-badge '+sc+'">'+m.score+'% match</span></div><div class="mcb"><div class="mname">'+m.first_name+' '+m.last_name+' '+idb+'</div><div class="mdet">'+(m.lifestyle||'Tenant')+' · '+(m.employment_status||'')+' · Move-in '+mi+'</div><div class="mtags"><span class="mtag g">Budget $'+Number(m.budget||0).toLocaleString()+'/mo</span>'+(m.bedrooms?'<span class="mtag">'+m.bedrooms+'</span>':'')+(m.pets?'<span class="mtag">'+m.pets+'</span>':'')+(m.lease_length?'<span class="mtag">'+m.lease_length+'</span>':'')+'</div><div class="mreasons">'+rh+'</div><div class="ai-box" id="ai_'+i+'"><div class="ai-label">✨ AI insight</div><div class="ai-text ai-loading" id="ai_text_'+i+'">Analyzing tenant fit...</div></div></div><div class="contact-reveal" id="contact_'+i+'"><div class="crow"><span>Email</span><span>'+m.email+'</span></div><div class="crow"><span>Phone</span><span>'+(m.phone||'Not provided')+'</span></div><div class="crow"><span>City</span><span>'+(m.city||'—')+'</span></div><div class="crow"><span>Credit check</span><span>'+(m.credit_consent||'—')+'</span></div></div><div class="mcf"><button class="btn-conn" data-i="'+i+'">📋 View contact info</button><button class="btn-sk">Skip</button></div>';grid.appendChild(card);});document.getElementById('matchesContainer').innerHTML='';document.getElementById('matchesContainer').appendChild(grid);document.querySelectorAll('.btn-conn').forEach(btn=>{btn.addEventListener('click',()=>{const i=btn.dataset.i;const p=document.getElementById('contact_'+i);const open=p.classList.contains('open');p.classList.toggle('open',!open);btn.textContent=open?'📋 View contact info':'✕ Hide contact info';});});document.querySelectorAll('.btn-sk').forEach(btn=>{btn.addEventListener('click',()=>btn.closest('.match-card').style.display='none');});}async function loadAI(landlord,match,index){const el=document.getElementById('ai_text_'+index);if(!el)return;try{const prompt='You are a rental matching assistant for twnhouse.ca. In 2 sentences max, explain warmly and specifically why this tenant is a strong match for this landlord property.\n\nProperty: '+(landlord.address||'Ontario')+', '+(landlord.property_type||'')+', $'+landlord.rent+'/mo, '+(landlord.lease_length||'flexible')+' lease.\n\nTenant: '+match.first_name+', '+(match.lifestyle||'')+' '+(match.employment_status||'')+', budget $'+match.budget+'/mo, looking in '+match.city+', wants '+(match.property_type||'any')+', move-in '+(match.move_in_date||'flexible')+'.\n\nMatch score: '+match.score+'%. Reasons: '+(match.reasons||[]).join(', ')+'.';const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:150,messages:[{role:'user',content:prompt}]})});const d=await res.json();el.textContent=d.content?.[0]?.text||'This tenant aligns well with your property.';el.classList.remove('ai-loading');}catch(e){el.textContent='This tenant aligns well with your property criteria.';el.classList.remove('ai-loading');}}})();</script></body></html>
